version: "3.9"

services:
  # ── Redis Cache ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: autofabric-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autofabric-backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── Streamlit Frontend ────────────────────────────────────────────────────────
  frontend:
    image: python:3.11-slim
    container_name: autofabric-frontend
    restart: unless-stopped
    ports:
      - "8502:8501"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app/frontend
      - ./requirements.txt:/app/requirements.txt
    working_dir: /app
    environment:
      - BACKEND_URL=http://backend:8000
    command: >
      bash -c "pip install streamlit requests --quiet &&
               streamlit run frontend/app.py
               --server.port=8501
               --server.address=0.0.0.0
               --server.headless=true
               --browser.gatherUsageStats=false"

volumes:
  redis_data:
    driver: local
